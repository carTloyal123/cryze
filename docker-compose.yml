services:
  bridge:
    build: .
    image: wyze-bridge:latest
    container_name: wyze-bridge
    platform: linux/arm64
    working_dir: /work
    volumes:
      - .:/work
      - ../apk:/apk:ro
    ports:
      - "1984:1984"     # go2rtc Web UI + API
      - "8554:8554"     # RTSP
      - "8555:8555/udp" # WebRTC
      - "8899:8899/udp" # P2P broadcast send
      - "8900:8900/udp" # P2P broadcast listen
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    stop_grace_period: 15s
    # entrypoint.py: setup libs, build bridge, start go2rtc, handle SIGINT
    # .env loaded at runtime by entrypoint.py (not docker compose) to
    # preserve literal $ in passwords. into.sh passes --env-file /dev/null.
