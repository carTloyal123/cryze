# Wyze Doorbell Bridge
# Usage: docker compose up
# Requires: Linux host, .env with Wyze credentials + DOORBELL_IP

services:

  network-setup:
    image: python:3.12-slim
    container_name: wyze-network
    network_mode: host
    privileged: true
    volumes:
      - ./src:/app/src:ro
      - ./logs:/app/logs
    env_file: .env
    environment:
      LOG_FILE: /app/logs/network.log
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command: >-
      sh -c "apt-get update -qq && apt-get install -y -qq iptables conntrack >/dev/null 2>&1;
             python3 /app/src/network/network_setup.py"
    restart: unless-stopped
    stop_grace_period: 5s

  relay:
    image: python:3.12-slim
    container_name: wyze-relay
    network_mode: host
    volumes:
      - ./src:/app/src:ro
      - ./cache:/app/cache
      - ./logs:/app/logs
    env_file: .env
    environment:
      DOORBELL_IP: ${DOORBELL_IP:-}
      CHIME_IP: ${CHIME_IP:-}
      SESSION_CACHE: /app/cache/session_keys.json
      LOG_FILE: /app/logs/relay.log
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command: >-
      python3 /app/src/relay/gutes_relay.py
      --mode relay
      --local-ip 0.0.0.0
      --session-cache /app/cache/session_keys.json
      --keepalive
      --mtp-port 23000
    depends_on:
      network-setup:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket;s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(2);s.sendto(b'\\x7f\\x01\\x1c\\x00'+b'\\x00'*24,('127.0.0.1',28800));d,a=s.recvfrom(256);exit(0 if len(d)>0 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: wyze-go2rtc
    network_mode: host
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
      - bridge-bin:/bridge:ro
      - sdk-libs:/libs:ro
      - apk-libs:/apk-libs:ro
      - ./scripts:/scripts:ro
      - ./cache:/cache
      - ./logs:/logs
      - ./.env:/config/.env:ro
    environment:
      LOG_FILE: /logs/bridge.log
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      relay:
        condition: service_healthy
      bridge-builder:
        condition: service_completed_successfully
    restart: unless-stopped

  bridge-builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: wyze-bridge-builder:latest
    platform: linux/arm64
    container_name: wyze-builder
    volumes:
      - .:/work
      - ../apk:/apk:ro
      - bridge-bin:/output
      - sdk-libs:/output-libs
      - apk-libs:/output-apk
    entrypoint: /bin/sh
    command: >-
      -c "
      cd /work &&
      python3 -c 'import sys; sys.path.insert(0,\"scripts\"); from entrypoint import setup_libs, build_bridge; setup_libs(); build_bridge()' &&
      mkdir -p /output /output-libs /output-apk &&
      cp /work/build/bridge /output/bridge &&
      chmod +x /output/bridge &&
      cp /work/scripts/run_bridge.sh /output/run_bridge.sh &&
      chmod +x /output/run_bridge.sh &&
      cp -r /work/libs/* /output-libs/ 2>/dev/null || true &&
      cp /lib/ld-musl-aarch64.so.1 /output-libs/ 2>/dev/null || true &&
      for lib in libcurl.so.4 libcrypto.so.3 libssl.so.3 libuuid.so.1 libz.so.1; do
        cp /lib/$lib /output-libs/ 2>/dev/null || cp /usr/lib/$lib /output-libs/ 2>/dev/null || true;
      done &&
      for lib in libstdc++.so.6 libgcc_s.so.1 libcares.so.2 libnghttp2.so.14 libidn2.so.0 libpsl.so.5 libzstd.so.1 libbrotlidec.so.1 libbrotlicommon.so.1 libunistring.so.5; do
        cp /usr/lib/$lib /output-libs/ 2>/dev/null || true;
      done &&
      cp -r /apk/xapk_contents/arm64_libs/lib/arm64-v8a/* /output-apk/ 2>/dev/null || true &&
      echo 'Bridge binary + libs copied to volumes'
      "
    restart: "no"

volumes:
  bridge-bin:
    name: wyze-bridge-bin
  sdk-libs:
    name: wyze-sdk-libs
  apk-libs:
    name: wyze-apk-libs
