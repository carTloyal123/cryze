services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: wyze-bridge:latest
    container_name: wyze-bridge
    platform: linux/arm64
    working_dir: /work
    # .env is loaded by entrypoint.py at runtime (not docker compose) to preserve
    # literal $ in passwords. Use ./into.sh which passes --env-file /dev/null.
    volumes:
      - .:/work
      - ../apk:/apk:ro
    ports:
      - "1984:1984"     # go2rtc Web UI + API
      - "8554:8554"     # RTSP
      - "8555:8555/udp" # WebRTC
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    # Python entrypoint handles: setup, build, go2rtc lifecycle, SIGINT/SIGTERM
    # go2rtc manages bridge on-demand (exec source spawns/kills per viewer)
    stop_grace_period: 15s
