services:
  # go2rtc + bridge: on-demand RTSP/WebRTC streaming
  bridge:
    build:
      context: ../bridge
      dockerfile: Dockerfile
    image: wyze-bridge:latest
    container_name: wyze-bridge
    platform: linux/arm64
    working_dir: /work
    volumes:
      - .:/work
      - ../apk:/apk:ro
    env_file:
      - .env
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  # Dev shell — same image, interactive, no go2rtc
  dev:
    image: wyze-bridge:latest
    container_name: wyze-bridge-dev
    platform: linux/arm64
    working_dir: /work
    volumes:
      - .:/work
      - ../apk:/apk:ro
    env_file:
      - .env
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    stdin_open: true
    tty: true
    entrypoint: /bin/bash
    profiles:
      - dev
