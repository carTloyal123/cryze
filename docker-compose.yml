services:

  network-setup:
    image: python:3.12-slim
    container_name: wyze-network
    network_mode: host
    privileged: true
    volumes:
      - ./src:/app/src:ro
      - ./logs:/app/logs
    env_file: .env
    environment:
      LOG_FILE: /app/logs/network.log
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command: >-
      sh -c "apt-get update -qq && apt-get install -y -qq iptables conntrack >/dev/null 2>&1;
             python3 /app/src/network/network_setup.py"
    restart: on-failure
    stop_grace_period: 5s

  relay:
    image: python:3.12-slim
    container_name: wyze-relay
    network_mode: host
    volumes:
      - ./src:/app/src:ro
      - ./cache:/app/cache
      - ./logs:/app/logs
    env_file: .env
    environment:
      SESSION_CACHE: /app/cache/session_keys.json
      LOG_FILE: /app/logs/relay.log
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command: >-
      python3 /app/src/relay/gutes_relay.py
      --mode ${RELAY_MODE:-relay}
      --local-ip 0.0.0.0
      --session-cache /app/cache/session_keys.json
      --registry /app/cache/device_registry.json
      --keepalive
      --mtp-port 23000
    depends_on:
      network-setup:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket;s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(2);s.sendto(b'\\x7f\\x01\\x1c\\x00'+b'\\x00'*24,('127.0.0.1',28800));d,a=s.recvfrom(256);exit(0 if len(d)>0 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  go2rtc:
    build:
      context: .
      dockerfile: Dockerfile
    image: wyze-bridge:latest
    platform: linux/arm64
    container_name: wyze-go2rtc
    network_mode: host
    volumes:
      - ./cache:/cache
      - ./cache:/app/cache
      - ./logs:/logs
      - ./.env:/work/.env:ro
    env_file: .env
    environment:
      LOG_FILE: /logs/bridge.log
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Relay runs as a separate container — entrypoint.py skips spawning its own
      RELAY_EXTERNAL: "1"
    command: ["python3", "/work/scripts/entrypoint.py"]
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped

  wyze-overlay:
    build:
      context: .
      dockerfile: src/overlay/Dockerfile.overlay
    image: wyze-overlay:latest
    container_name: wyze-overlay
    network_mode: host
    volumes:
      - ./cache:/cache:ro
      - ./logs:/logs
    env_file: .env
    environment:
      CACHE_DIR: /cache
      LOG_FILE: /logs/overlay.log
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      relay:
        condition: service_healthy
    profiles:
      - overlay
    restart: unless-stopped
