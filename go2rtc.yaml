# go2rtc config — Wyze doorbell bridge
#
# The bridge binary is launched on-demand when a viewer connects.
# H.264 Annex B frames flow via stdout pipe to go2rtc.
# Bridge is killed (SIGINT) when the last viewer disconnects.

streams:
  doorbell:
    - exec:/bridge/run_bridge.sh#video=h264#killsignal=2#killtimeout=10

rtsp:
  listen: ":8554"
  default_query: "video"

webrtc:
  listen: ":8555"

api:
  listen: ":1984"

log:
  level: info
