# go2rtc — on-demand Wyze doorbell stream
#
# Bridge is launched when a viewer connects and killed (SIGINT) when
# the last viewer disconnects. H.264 Annex B flows via stdout pipe.

streams:
  doorbell:
    - exec:/work/build/bridge --stdout#killsignal=2#killtimeout=5

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"

api:
  listen: ":1984"

log:
  level: debug
